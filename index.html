<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 20px;
        }

        h1 {
            color: #333;
            font-size: 2rem;
        }

        .week-navigation {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .nav-btn {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
            font-weight: 600;
        }

        .nav-btn:hover {
            background: #5568d3;
        }

        .week-display {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            min-width: 200px;
            text-align: center;
        }

        .week-grid {
            display: grid;
            grid-template-columns: 0 repeat(7, 1fr) 0;
            gap: 15px;
            margin-bottom: 20px;
            transition: grid-template-columns 0.2s ease;
        }

        body.dragging-todo .week-grid {
            grid-template-columns: 60px repeat(7, 1fr) 60px;
        }

        .day-column {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 15px;
            min-height: 400px;
            display: flex;
            flex-direction: column;
        }

        .day-header {
            text-align: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e0e0e0;
        }

        .day-name {
            font-size: 14px;
            color: #999;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .day-number {
            font-size: 24px;
            font-weight: 700;
            color: #333;
        }

        .day-number.today {
            color: #667eea;
        }

        .day-input-container {
            margin-bottom: 15px;
        }

        .day-input {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .day-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .day-todos {
            flex: 1;
            overflow-y: auto;
            max-height: 300px;
        }

        .todo-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            margin-bottom: 8px;
            background: white;
            border-radius: 8px;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: grab;
        }

        .todo-item:active {
            cursor: grabbing;
        }

        .todo-item.dragging {
            opacity: 0.5;
        }

        .day-todos.drag-over {
            background: rgba(102, 126, 234, 0.15);
            border-radius: 10px;
            border: 2px dashed #667eea;
        }

        .week-drop-zone {
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            border-radius: 15px;
            border: 2px dashed #667eea;
            background: rgba(102, 126, 234, 0.08);
            font-size: 13px;
            font-weight: 600;
            color: #667eea;
            opacity: 0;
            pointer-events: none;
            overflow: hidden;
            transition: opacity 0.2s ease, background 0.2s;
        }

        body.dragging-todo .week-drop-zone {
            opacity: 1;
            pointer-events: auto;
        }

        .week-drop-zone.drag-over {
            background: rgba(102, 126, 234, 0.22);
        }

        .todo-item:hover {
            transform: translateX(3px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .todo-item.completed {
            opacity: 0.6;
        }

        .todo-item.completed .todo-text {
            text-decoration: line-through;
            color: #999;
        }

        .todo-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #667eea;
            flex-shrink: 0;
        }

        .todo-text {
            flex: 1;
            font-size: 14px;
            color: #333;
            word-break: break-word;
        }

        .delete-btn {
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.3s;
            flex-shrink: 0;
        }

        .delete-btn:hover {
            background: #ee5a5a;
        }

        .empty-day {
            text-align: center;
            color: #999;
            padding: 20px 10px;
            font-size: 14px;
        }

        .save-toolbar {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
            flex-wrap: wrap;
        }

        .save-status {
            font-size: 13px;
            color: #28a745;
            min-height: 20px;
        }

        .save-status.saved {
            animation: fadeOut 2s ease-in 1s forwards;
        }

        @keyframes fadeOut {
            to { opacity: 0; }
        }

        .btn-secondary {
            padding: 8px 16px;
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .import-input {
            display: none;
        }

        @media (max-width: 1200px) {
            .week-grid {
                grid-template-columns: 0 repeat(7, 1fr) 0;
            }
            body.dragging-todo .week-grid {
                grid-template-columns: 60px repeat(7, 1fr) 60px;
            }
        }

        @media (max-width: 768px) {
            .week-grid {
                grid-template-columns: 0 repeat(7, 1fr) 0;
            }
            body.dragging-todo .week-grid {
                grid-template-columns: 50px repeat(7, 1fr) 50px;
            }
            .container {
                padding: 15px;
            }
        }

        @media (max-width: 480px) {
            .week-grid {
                grid-template-columns: 0 repeat(7, 1fr) 0;
            }
            body.dragging-todo .week-grid {
                grid-template-columns: 44px repeat(7, 1fr) 44px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>To Do</h1>
            <div class="week-navigation">
                <button class="nav-btn" onclick="previousWeek()">← Previous</button>
                <div class="week-display" id="weekDisplay"></div>
                <button class="nav-btn" onclick="nextWeek()">Next →</button>
            </div>
        </div>
        <div class="week-grid" id="weekGrid"></div>
        <div class="save-toolbar">
            <span class="save-status" id="saveStatus" aria-live="polite"></span>
            <button type="button" class="btn-secondary" onclick="exportBackup()">Export backup to file</button>
            <button type="button" class="btn-secondary" onclick="document.getElementById('importFile').click()">Import from backup</button>
            <input type="file" id="importFile" class="import-input" accept=".json,application/json" onchange="importBackup(event)">
        </div>
    </div>

    <script>
        let currentWeekStart = new Date();
        // Set to start of current week (Sunday)
        currentWeekStart.setDate(currentWeekStart.getDate() - currentWeekStart.getDay());
        currentWeekStart.setHours(0, 0, 0, 0);

        let todos = JSON.parse(localStorage.getItem('weeklyTodos')) || {};

        function getDateKey(date) {
            // Use local date components to avoid timezone issues
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function formatDate(date) {
            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const months = ['January', 'February', 'March', 'April', 'May', 'June', 
                          'July', 'August', 'September', 'October', 'November', 'December'];
            return `${days[date.getDay()]}, ${months[date.getMonth()]} ${date.getDate()}`;
        }

        function getWeekDates(startDate) {
            const dates = [];
            for (let i = 0; i < 7; i++) {
                const date = new Date(startDate);
                date.setDate(startDate.getDate() + i);
                dates.push(date);
            }
            return dates;
        }

        function isToday(date) {
            const today = new Date();
            return date.toDateString() === today.toDateString();
        }

        function renderWeek() {
            const weekGrid = document.getElementById('weekGrid');
            const weekDisplay = document.getElementById('weekDisplay');
            const weekDates = getWeekDates(currentWeekStart);
            
            // Update week display
            const weekEnd = new Date(weekDates[6]);
            weekDisplay.textContent = `${formatDate(weekDates[0])} - ${formatDate(weekEnd)}`;

            const dropPrevHtml = '<div class="week-drop-zone" id="dropPrevWeek" data-move="prev" title="Drop to move to same day, previous week">← Prev week</div>';
            const dropNextHtml = '<div class="week-drop-zone" id="dropNextWeek" data-move="next" title="Drop to move to same day, next week">Next week →</div>';

            weekGrid.innerHTML = dropPrevHtml + weekDates.map((date, index) => {
                const dateKey = getDateKey(date);
                const dayTodos = todos[dateKey] || [];
                const dayName = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][date.getDay()];
                const isTodayClass = isToday(date) ? 'today' : '';

                // Sort todos: incomplete first, then completed
                const sortedTodos = [...dayTodos].sort((a, b) => {
                    if (a.completed === b.completed) return 0;
                    return a.completed ? 1 : -1;
                });

                return `
                    <div class="day-column">
                        <div class="day-header">
                            <div class="day-name">${dayName}</div>
                            <div class="day-number ${isTodayClass}">${date.getDate()}</div>
                        </div>
                        <div class="day-input-container">
                            <input 
                                type="text" 
                                class="day-input" 
                                placeholder="Add task..."
                                data-date="${dateKey}"
                                onkeypress="handleDayInputKeypress(event, '${dateKey}')"
                            >
                        </div>
                        <div class="day-todos" data-date="${dateKey}" ondragover="handleDayDragOver(event)" ondragleave="handleDayDragLeave(event)" ondrop="handleDayDrop(event)">
                            ${sortedTodos.length === 0 
                                ? '<div class="empty-day">No tasks</div>'
                                : sortedTodos.map((todo, todoIndex) => {
                                    const actualIndex = dayTodos.findIndex(t => t.id === todo.id);
                                    return `
                                        <div class="todo-item ${todo.completed ? 'completed' : ''}" draggable="true" ondragstart="handleTodoDragStart(event, '${dateKey}', ${actualIndex})" ondragend="handleTodoDragEnd(event)">
                                            <input 
                                                type="checkbox" 
                                                class="todo-checkbox" 
                                                ${todo.completed ? 'checked' : ''}
                                                onchange="toggleTodo('${dateKey}', ${actualIndex})"
                                            >
                                            <span class="todo-text">${escapeHtml(todo.text)}</span>
                                            <button class="delete-btn" onclick="deleteTodo('${dateKey}', ${actualIndex})">×</button>
                                        </div>
                                    `;
                                }).join('')
                            }
                        </div>
                    </div>
                `;
            }).join('') + dropNextHtml;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function handleDayInputKeypress(event, dateKey) {
            if (event.key === 'Enter') {
                addTodoToDay(dateKey);
            }
        }

        const DRAG_TYPE = 'application/x-weekly-todos';

        function handleTodoDragStart(event, dateKey, index) {
            if (event.target.closest('input, button')) {
                event.preventDefault();
                return;
            }
            event.dataTransfer.setData(DRAG_TYPE, JSON.stringify({ dateKey, index }));
            event.dataTransfer.effectAllowed = 'move';
            event.target.classList.add('dragging');
            document.body.classList.add('dragging-todo');
        }

        function handleTodoDragEnd(event) {
            event.target.classList.remove('dragging');
            document.body.classList.remove('dragging-todo');
            document.querySelectorAll('.day-todos.drag-over, .week-drop-zone.drag-over').forEach(el => el.classList.remove('drag-over'));
        }

        function handleDayDragOver(event) {
            event.preventDefault();
            event.dataTransfer.dropEffect = 'move';
            event.currentTarget.classList.add('drag-over');
        }

        function handleDayDragLeave(event) {
            if (!event.currentTarget.contains(event.relatedTarget)) {
                event.currentTarget.classList.remove('drag-over');
            }
        }

        function handleDayDrop(event) {
            event.preventDefault();
            event.currentTarget.classList.remove('drag-over');
            const targetDateKey = event.currentTarget.dataset.date;
            const data = event.dataTransfer.getData(DRAG_TYPE);
            if (!data) return;
            const { dateKey, index } = JSON.parse(data);
            moveTodo(dateKey, index, targetDateKey);
        }

        function setupWeekDropZones() {
            ['prev', 'next'].forEach(move => {
                const el = document.getElementById('drop' + (move === 'prev' ? 'Prev' : 'Next') + 'Week');
                if (!el) return;
                el.ondragover = function (e) {
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                    el.classList.add('drag-over');
                };
                el.ondragleave = function (e) {
                    if (!el.contains(e.relatedTarget)) el.classList.remove('drag-over');
                };
                el.ondrop = function (e) {
                    e.preventDefault();
                    el.classList.remove('drag-over');
                    const data = e.dataTransfer.getData(DRAG_TYPE);
                    if (!data) return;
                    const { dateKey, index } = JSON.parse(data);
                    const sourceDate = new Date(dateKey + 'T12:00:00');
                    const newDate = new Date(sourceDate);
                    newDate.setDate(sourceDate.getDate() + (move === 'next' ? 7 : -7));
                    const newDateKey = getDateKey(newDate);
                    moveTodo(dateKey, index, newDateKey);
                };
            });
        }

        function moveTodo(fromDateKey, fromIndex, toDateKey) {
            if (fromDateKey === toDateKey) return;
            const todo = todos[fromDateKey]?.[fromIndex];
            if (!todo) return;
            todos[fromDateKey].splice(fromIndex, 1);
            if (todos[fromDateKey].length === 0) delete todos[fromDateKey];
            if (!todos[toDateKey]) todos[toDateKey] = [];
            todos[toDateKey].push(todo);
            saveTodos();
            renderWeek();
            setupWeekDropZones();
        }

        function addTodoToDay(dateKey) {
            const input = document.querySelector(`.day-input[data-date="${dateKey}"]`);
            const text = input.value.trim();
            
            if (text === '') {
                return;
            }

            if (!todos[dateKey]) {
                todos[dateKey] = [];
            }

            const newTodo = {
                id: Date.now() + Math.random(),
                text: text,
                completed: false
            };

            todos[dateKey].push(newTodo);
            input.value = '';
            saveTodos();
            renderWeek();
        }

        function toggleTodo(dateKey, index) {
            if (!todos[dateKey] || !todos[dateKey][index]) return;
            
            todos[dateKey][index].completed = !todos[dateKey][index].completed;
            saveTodos();
            renderWeek();
        }

        function deleteTodo(dateKey, index) {
            if (!todos[dateKey] || !todos[dateKey][index]) return;
            
            todos[dateKey].splice(index, 1);
            if (todos[dateKey].length === 0) {
                delete todos[dateKey];
            }
            saveTodos();
            renderWeek();
        }

        function previousWeek() {
            currentWeekStart.setDate(currentWeekStart.getDate() - 7);
            renderWeek();
        }

        function nextWeek() {
            currentWeekStart.setDate(currentWeekStart.getDate() + 7);
            renderWeek();
        }

        function saveTodos() {
            localStorage.setItem('weeklyTodos', JSON.stringify(todos));
            showSavedStatus();
        }

        function showSavedStatus() {
            const el = document.getElementById('saveStatus');
            if (!el) return;
            el.textContent = 'Saved';
            el.classList.remove('saved');
            el.offsetHeight;
            el.classList.add('saved');
        }

        function exportBackup() {
            const data = { weeklyTodos: todos, exportedAt: new Date().toISOString() };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'weekly-todos-backup-' + new Date().toISOString().slice(0, 10) + '.json';
            a.click();
            URL.revokeObjectURL(a.href);
            showSavedStatus();
        }

        function importBackup(event) {
            const file = event.target.files?.[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function () {
                try {
                    const data = JSON.parse(reader.result);
                    const imported = data.weeklyTodos || data;
                    if (typeof imported !== 'object' || imported === null) throw new Error('Invalid format');
                    todos = imported;
                    saveTodos();
                    renderWeek();
                    const statusEl = document.getElementById('saveStatus');
                    statusEl.textContent = 'Import complete';
                    statusEl.style.color = '';
                    statusEl.classList.remove('saved');
                } catch (e) {
                    const statusEl = document.getElementById('saveStatus');
                    statusEl.textContent = 'Import failed: invalid file';
                    statusEl.style.color = '#dc3545';
                }
                event.target.value = '';
            };
            reader.readAsText(file);
        }

        window.addEventListener('beforeunload', function () {
            saveTodos();
        });

        // Initial render
        renderWeek();
        setupWeekDropZones();
    </script>
</body>
</html>
