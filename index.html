<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Helvetica Neue', Helvetica, sans-serif;
        }

        body {
            font-family: inherit;
            background: #c4b89a;
            min-height: 100vh;
            padding: 24px;
        }

        .container {
            background: #faf6e8;
            border-radius: 2px;
            box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.12), 0 0 0 1px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 28px 28px 28px 44px;
            border-left: 12px solid #e8dcb8;
            position: relative;
        }

        .container + .container {
            margin-top: 24px;
        }

        .container::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 12px;
            background: repeating-linear-gradient(
                180deg,
                transparent,
                transparent 18px,
                rgba(0, 0, 0, 0.06) 18px,
                rgba(0, 0, 0, 0.06) 19px
            );
            border-radius: 2px 0 0 2px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 20px;
        }

        h1 {
            color: #3d3429;
            font-size: 2rem;
            font-weight: 600;
        }

        .week-navigation {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .nav-btn {
            padding: 10px 20px;
            background: #8b7355;
            color: #faf6e8;
            border: 1px solid #7a6349;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            font-weight: 600;
            font-family: inherit;
        }

        .nav-btn:hover {
            background: #7a6349;
            color: #fff;
        }

        .week-display {
            font-size: 18px;
            font-weight: 600;
            color: #3d3429;
            min-width: 200px;
            text-align: center;
        }

        .week-grid {
            display: grid;
            grid-template-columns: 0 repeat(7, 1fr) 0;
            gap: 15px;
            margin-bottom: 20px;
            transition: grid-template-columns 0.2s ease;
        }

        body.dragging-todo .week-grid {
            grid-template-columns: 60px repeat(7, 1fr) 60px;
        }

        .day-column {
            background: rgba(255, 255, 255, 0.5);
            border-radius: 4px;
            padding: 15px;
            min-height: 400px;
            display: flex;
            flex-direction: column;
            border: 1px solid #e8e0c8;
        }

        .day-column.today {
            box-shadow: 0 2px 12px rgba(61, 52, 41, 0.2), 0 0 0 2px rgba(61, 52, 41, 0.12);
        }

        .day-header {
            text-align: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e0d8c0;
        }

        .day-name {
            font-size: 14px;
            color: #5a5046;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .day-number {
            font-size: 24px;
            font-weight: 700;
            color: #3d3429;
        }

        .day-number.today {
            color: #3d3429;
        }

        .day-input-container {
            margin-bottom: 15px;
        }

        .day-input {
            width: 100%;
            padding: 10px;
            border: 1px solid #d8d0b8;
            border-radius: 4px;
            font-size: 14px;
            transition: border-color 0.2s;
            background: rgba(255, 255, 255, 0.7);
            font-family: inherit;
            color: #3d3429;
        }

        .day-input::placeholder {
            color: #6b6156;
        }

        .day-input:focus {
            outline: none;
            border-color: #8b7355;
            background: #fff;
        }

        .day-todos {
            flex: 1;
            overflow-y: auto;
            max-height: 300px;
        }

        .todo-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 4px;
            border: 1px solid #e8e0c8;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: grab;
        }

        .todo-item:active {
            cursor: grabbing;
        }

        .todo-item.dragging {
            opacity: 0.5;
        }

        .day-todos.drag-over {
            background: rgba(139, 115, 85, 0.12);
            border-radius: 4px;
            border: 2px dashed #8b7355;
        }

        .week-drop-zone {
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            border-radius: 4px;
            border: 2px dashed #8b7355;
            background: rgba(139, 115, 85, 0.06);
            font-size: 13px;
            font-weight: 600;
            color: #5a5046;
            opacity: 0;
            pointer-events: none;
            overflow: hidden;
            transition: opacity 0.2s ease, background 0.2s;
        }

        body.dragging-todo .week-drop-zone {
            opacity: 1;
            pointer-events: auto;
        }

        .week-drop-zone.drag-over {
            background: rgba(139, 115, 85, 0.18);
        }

        .todo-item:hover {
            transform: translateX(2px);
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
        }

        .todo-item.completed {
            opacity: 0.65;
        }

        .todo-item.completed .todo-text {
            text-decoration: line-through;
            color: #5a5046;
        }

        .todo-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #8b7355;
            flex-shrink: 0;
        }

        .todo-text {
            flex: 1;
            font-size: 14px;
            color: #3d3429;
            word-break: break-word;
            cursor: text;
        }

        .todo-item.editing {
            cursor: default;
        }

        .todo-edit-input {
            flex: 1;
            font-size: 14px;
            color: #3d3429;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #8b7355;
            border-radius: 4px;
            padding: 6px 8px;
            font-family: inherit;
            min-width: 0;
        }

        .todo-edit-input:focus {
            outline: none;
            border-color: #8b7355;
            box-shadow: 0 0 0 2px rgba(139, 115, 85, 0.2);
        }

        .delete-btn {
            background: #b85450;
            color: #faf6e8;
            border: 1px solid #a04844;
            border-radius: 4px;
            padding: 6px 12px;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s;
            flex-shrink: 0;
            font-family: inherit;
        }

        .delete-btn:hover {
            background: #a04844;
        }

        .empty-day {
            text-align: center;
            color: #5a5046;
            padding: 20px 10px;
            font-size: 14px;
        }

        .save-toolbar-wrapper {
            width: 100%;
            max-width: 1400px;
            margin: 24px auto 0;
        }

        .save-toolbar {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 0;
            padding-top: 20px;
            border-top: 1px solid #e0d8c0;
            flex-wrap: wrap;
        }

        .save-status {
            font-size: 13px;
            color: #5a7c4a;
            min-height: 20px;
        }

        .save-status.saved {
            animation: fadeOut 2s ease-in 1s forwards;
        }

        @keyframes fadeOut {
            to { opacity: 0; }
        }

        .btn-secondary {
            padding: 8px 16px;
            background: #8b7355;
            color: #faf6e8;
            border: 1px solid #7a6349;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
            font-family: inherit;
        }

        .btn-secondary:hover {
            background: #7a6349;
        }

        .import-input {
            display: none;
        }

        @media (max-width: 1200px) {
            .week-grid {
                grid-template-columns: 0 repeat(7, 1fr) 0;
            }
            body.dragging-todo .week-grid {
                grid-template-columns: 60px repeat(7, 1fr) 60px;
            }
        }

        @media (max-width: 768px) {
            .week-grid {
                grid-template-columns: 0 repeat(7, 1fr) 0;
            }
            body.dragging-todo .week-grid {
                grid-template-columns: 50px repeat(7, 1fr) 50px;
            }
            .container {
                padding: 15px;
            }
        }

        @media (max-width: 480px) {
            .week-grid {
                grid-template-columns: 0 repeat(7, 1fr) 0;
            }
            body.dragging-todo .week-grid {
                grid-template-columns: 44px repeat(7, 1fr) 44px;
            }
        }

        /* Weekly project tracker */
        .tracker-section {
            margin-top: 0;
            padding-top: 0;
        }

        .tracker-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .tracker-header h2 {
            color: #3d3429;
            font-size: 1.5rem;
            font-weight: 600;
        }

        .month-navigation {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .month-display {
            font-size: 16px;
            font-weight: 600;
            color: #3d3429;
            min-width: 160px;
            text-align: center;
        }

        .month-grid-wrapper {
            overflow-x: auto;
            overflow-y: hidden;
            width: 100%;
            -webkit-overflow-scrolling: touch;
        }

        .month-grid {
            display: flex;
            flex-wrap: nowrap;
            gap: 12px;
            width: 100%;
            min-width: min-content;
        }

        .week-column {
            flex: 1 1 0;
            min-width: 140px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 4px;
            padding: 15px;
            min-height: 320px;
            display: flex;
            flex-direction: column;
            border: 1px solid #e8e0c8;
        }

        .week-column.current-week {
            box-shadow: 0 2px 12px rgba(61, 52, 41, 0.2), 0 0 0 2px rgba(61, 52, 41, 0.12);
        }

        .week-column-header {
            text-align: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #e0d8c0;
        }

        .week-range {
            font-size: 13px;
            font-weight: 600;
            color: #3d3429;
        }

        .project-input-container {
            margin-bottom: 12px;
        }

        .project-input {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #d8d0b8;
            border-radius: 4px;
            font-size: 13px;
            background: rgba(255, 255, 255, 0.7);
            font-family: inherit;
            color: #3d3429;
        }

        .project-input::placeholder {
            color: #6b6156;
        }

        .project-input:focus {
            outline: none;
            border-color: #8b7355;
            background: #fff;
        }

        .project-items {
            flex: 1;
            overflow-y: auto;
            max-height: 260px;
            transition: background 0.2s, border-color 0.2s;
        }

        .project-items.drag-over {
            background: rgba(139, 115, 85, 0.12);
            border-radius: 4px;
            border: 2px dashed #8b7355;
        }

        .project-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            margin-bottom: 6px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 4px;
            border: 1px solid #e8e0c8;
            cursor: grab;
        }

        .project-item:active {
            cursor: grabbing;
        }

        .project-item.dragging {
            opacity: 0.5;
        }

        .project-item .project-text {
            flex: 1;
            font-size: 13px;
            color: #3d3429;
            word-break: break-word;
            cursor: text;
        }

        .project-item .project-delete {
            background: #b85450;
            color: #faf6e8;
            border: 1px solid #a04844;
            border-radius: 4px;
            padding: 4px 10px;
            font-size: 11px;
            cursor: pointer;
            font-family: inherit;
            flex-shrink: 0;
        }

        .project-item .project-delete:hover {
            background: #a04844;
        }

        .project-item.editing .project-text {
            cursor: default;
        }

        .project-edit-input {
            flex: 1;
            font-size: 13px;
            color: #3d3429;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #8b7355;
            border-radius: 4px;
            padding: 4px 8px;
            font-family: inherit;
            min-width: 0;
        }

        .empty-week {
            text-align: center;
            color: #5a5046;
            padding: 16px 8px;
            font-size: 13px;
        }

        .jump-to-current {
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid #e0d8c0;
            text-align: center;
        }

        .jump-to-current .btn-jump {
            padding: 6px 14px;
            background: transparent;
            color: #8b7355;
            border: 1px solid #8b7355;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 500;
        }

        .jump-to-current .btn-jump:hover {
            background: rgba(139, 115, 85, 0.12);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>To Do</h1>
            <div class="week-navigation">
                <button class="nav-btn" onclick="previousWeek()">← Previous</button>
                <div class="week-display" id="weekDisplay"></div>
                <button class="nav-btn" onclick="nextWeek()">Next →</button>
            </div>
        </div>
        <div class="week-grid" id="weekGrid"></div>
        <div class="jump-to-current">
            <button type="button" class="btn-jump" onclick="jumpToCurrentWeek()">Jump to current week</button>
        </div>
    </div>

    <div class="container">
        <section class="tracker-section" aria-label="Weekly project tracker">
            <div class="tracker-header">
                <h2>Weekly project tracker</h2>
                <div class="month-navigation">
                    <button type="button" class="nav-btn" onclick="previousMonth()">← Previous</button>
                    <div class="month-display" id="monthDisplay"></div>
                    <button type="button" class="nav-btn" onclick="nextMonth()">Next →</button>
                </div>
            </div>
            <div class="month-grid-wrapper">
                <div class="month-grid" id="projectsGrid"></div>
            </div>
            <div class="jump-to-current">
                <button type="button" class="btn-jump" onclick="jumpToCurrentMonth()">Jump to current month</button>
            </div>
        </section>
    </div>

    <div class="save-toolbar-wrapper">
        <div class="save-toolbar">
            <span class="save-status" id="saveStatus" aria-live="polite"></span>
            <button type="button" class="btn-secondary" onclick="exportBackup()">Export backup to file</button>
            <button type="button" class="btn-secondary" onclick="document.getElementById('importFile').click()">Import from backup</button>
            <input type="file" id="importFile" class="import-input" accept=".json,application/json" onchange="importBackup(event)">
        </div>
    </div>

    <script>
        let currentWeekStart = new Date();
        // Set to start of current week (Sunday)
        currentWeekStart.setDate(currentWeekStart.getDate() - currentWeekStart.getDay());
        currentWeekStart.setHours(0, 0, 0, 0);

        let todos = JSON.parse(localStorage.getItem('weeklyTodos')) || {};
        let currentMonthStart = new Date();
        currentMonthStart.setDate(1);
        currentMonthStart.setHours(0, 0, 0, 0);
        let weeklyProjects = JSON.parse(localStorage.getItem('weeklyProjects')) || {};

        function getDateKey(date) {
            // Use local date components to avoid timezone issues
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function formatDate(date) {
            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const months = ['January', 'February', 'March', 'April', 'May', 'June', 
                          'July', 'August', 'September', 'October', 'November', 'December'];
            return `${days[date.getDay()]}, ${months[date.getMonth()]} ${date.getDate()}`;
        }

        function getWeekDates(startDate) {
            const dates = [];
            for (let i = 0; i < 7; i++) {
                const date = new Date(startDate);
                date.setDate(startDate.getDate() + i);
                dates.push(date);
            }
            return dates;
        }

        function isToday(date) {
            const today = new Date();
            return date.toDateString() === today.toDateString();
        }

        function getWeekKey(date) {
            const d = new Date(date);
            d.setDate(d.getDate() - d.getDay());
            d.setHours(0, 0, 0, 0);
            return getDateKey(d);
        }

        function getWeeksInMonth(monthStart) {
            const weeks = [];
            const start = new Date(monthStart);
            start.setDate(1);
            const firstSunday = new Date(start);
            firstSunday.setDate(start.getDate() - start.getDay());
            const end = new Date(monthStart.getFullYear(), monthStart.getMonth() + 1, 0);
            let weekStart = new Date(firstSunday);
            while (weekStart <= end || weeks.length < 4) {
                weeks.push(new Date(weekStart));
                weekStart.setDate(weekStart.getDate() + 7);
                if (weeks.length >= 6) break;
            }
            return weeks;
        }

        function formatWeekRange(weekStartDate) {
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            const start = new Date(weekStartDate);
            const end = new Date(start);
            end.setDate(end.getDate() + 6);
            const s = `${months[start.getMonth()]} ${start.getDate()}`;
            const e = `${months[end.getMonth()]} ${end.getDate()}`;
            return `${s} – ${e}`;
        }

        function formatMonthYear(date) {
            const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
            return `${months[date.getMonth()]} ${date.getFullYear()}`;
        }

        function isCurrentWeek(weekStartDate) {
            const today = new Date();
            const thisWeekKey = getWeekKey(today);
            return getWeekKey(weekStartDate) === thisWeekKey;
        }

        function renderProjectsMonth() {
            const grid = document.getElementById('projectsGrid');
            const monthDisplay = document.getElementById('monthDisplay');
            if (!grid || !monthDisplay) return;
            monthDisplay.textContent = formatMonthYear(currentMonthStart);
            const weeks = getWeeksInMonth(currentMonthStart);
            grid.innerHTML = weeks.map(weekStart => {
                const weekKey = getWeekKey(weekStart);
                const items = weeklyProjects[weekKey] || [];
                const currentClass = isCurrentWeek(weekStart) ? 'current-week' : '';
                return `
                    <div class="week-column ${currentClass}">
                        <div class="week-column-header">
                            <div class="week-range">${formatWeekRange(weekStart)}</div>
                        </div>
                        <div class="project-input-container">
                            <input type="text" class="project-input" placeholder="Add project"
                                data-week="${weekKey}"
                                onkeypress="handleProjectInputKeypress(event, '${weekKey}')">
                        </div>
                        <div class="project-items" data-week="${weekKey}" ondragover="handleProjectDragOver(event)" ondragleave="handleProjectDragLeave(event)" ondrop="handleProjectDrop(event)">
                            ${items.length === 0
                                ? '<div class="empty-week">Nothing yet</div>'
                                : items.map((item, idx) => `
                                    <div class="project-item" draggable="true" ondragstart="handleProjectDragStart(event, '${weekKey}', ${idx})" ondragend="handleProjectDragEnd(event)">
                                        <span class="project-text" ondblclick="startEditProjectItem(event, '${weekKey}', ${idx})" title="Double-click to edit">${escapeHtml(item.text)}</span>
                                        <button type="button" class="project-delete" onclick="deleteProjectItem('${weekKey}', ${idx})">×</button>
                                    </div>
                                `).join('')
                            }
                        </div>
                    </div>
                `;
            }).join('');
        }

        function handleProjectInputKeypress(event, weekKey) {
            if (event.key === 'Enter') {
                addProjectItem(weekKey);
            }
        }

        function addProjectItem(weekKey) {
            const input = document.querySelector(`.project-input[data-week="${weekKey}"]`);
            if (!input) return;
            const text = input.value.trim();
            if (text === '') return;
            if (!weeklyProjects[weekKey]) weeklyProjects[weekKey] = [];
            weeklyProjects[weekKey].push({ id: Date.now() + Math.random(), text });
            input.value = '';
            saveProjects();
            renderProjectsMonth();
        }

        const DRAG_TYPE_PROJECT = 'application/x-weekly-projects';

        function handleProjectDragStart(event, weekKey, index) {
            if (event.target.closest('button, input')) {
                event.preventDefault();
                return;
            }
            event.dataTransfer.setData(DRAG_TYPE_PROJECT, JSON.stringify({ weekKey, index }));
            event.dataTransfer.effectAllowed = 'move';
            event.target.classList.add('dragging');
            document.body.classList.add('dragging-project');
        }

        function handleProjectDragEnd(event) {
            event.target.classList.remove('dragging');
            document.body.classList.remove('dragging-project');
            document.querySelectorAll('.project-items.drag-over').forEach(el => el.classList.remove('drag-over'));
        }

        function handleProjectDragOver(event) {
            event.preventDefault();
            event.dataTransfer.dropEffect = 'move';
            event.currentTarget.classList.add('drag-over');
        }

        function handleProjectDragLeave(event) {
            if (!event.currentTarget.contains(event.relatedTarget)) {
                event.currentTarget.classList.remove('drag-over');
            }
        }

        function handleProjectDrop(event) {
            event.preventDefault();
            event.currentTarget.classList.remove('drag-over');
            const toWeekKey = event.currentTarget.dataset.week;
            const data = event.dataTransfer.getData(DRAG_TYPE_PROJECT);
            if (!data) return;
            const { weekKey: fromWeekKey, index } = JSON.parse(data);
            moveProjectItem(fromWeekKey, index, toWeekKey);
        }

        function moveProjectItem(fromWeekKey, fromIndex, toWeekKey) {
            if (fromWeekKey === toWeekKey) return;
            const item = weeklyProjects[fromWeekKey]?.[fromIndex];
            if (!item) return;
            weeklyProjects[fromWeekKey].splice(fromIndex, 1);
            if (weeklyProjects[fromWeekKey].length === 0) delete weeklyProjects[fromWeekKey];
            if (!weeklyProjects[toWeekKey]) weeklyProjects[toWeekKey] = [];
            weeklyProjects[toWeekKey].push(item);
            saveProjects();
            renderProjectsMonth();
        }

        function deleteProjectItem(weekKey, index) {
            if (!weeklyProjects[weekKey] || !weeklyProjects[weekKey][index]) return;
            weeklyProjects[weekKey].splice(index, 1);
            if (weeklyProjects[weekKey].length === 0) delete weeklyProjects[weekKey];
            saveProjects();
            renderProjectsMonth();
        }

        function updateProjectItem(weekKey, index, newText) {
            if (!weeklyProjects[weekKey] || !weeklyProjects[weekKey][index]) return;
            newText = (newText || '').trim();
            if (newText === '') return;
            weeklyProjects[weekKey][index].text = newText;
            saveProjects();
            renderProjectsMonth();
        }

        function startEditProjectItem(event, weekKey, index) {
            if (event.target.closest('input')) return;
            const item = event.target.closest('.project-item');
            const span = event.target;
            if (!item || !span.classList.contains('project-text')) return;
            const currentText = (weeklyProjects[weekKey] && weeklyProjects[weekKey][index]) ? weeklyProjects[weekKey][index].text : '';
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'project-edit-input';
            input.value = currentText;
            item.classList.add('editing');
            span.replaceWith(input);
            input.focus();
            input.select();
            function finish() {
                const newText = input.value.trim();
                item.classList.remove('editing');
                if (newText !== '' && newText !== currentText) {
                    updateProjectItem(weekKey, index, newText);
                } else {
                    renderProjectsMonth();
                }
            }
            input.onblur = finish;
            input.onkeydown = function (e) {
                if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
                if (e.key === 'Escape') { e.preventDefault(); renderProjectsMonth(); }
            };
        }

        function saveProjects() {
            localStorage.setItem('weeklyProjects', JSON.stringify(weeklyProjects));
            showSavedStatus();
        }

        function previousMonth() {
            currentMonthStart.setMonth(currentMonthStart.getMonth() - 1);
            renderProjectsMonth();
        }

        function nextMonth() {
            currentMonthStart.setMonth(currentMonthStart.getMonth() + 1);
            renderProjectsMonth();
        }

        function jumpToCurrentMonth() {
            const now = new Date();
            currentMonthStart.setFullYear(now.getFullYear());
            currentMonthStart.setMonth(now.getMonth());
            currentMonthStart.setDate(1);
            currentMonthStart.setHours(0, 0, 0, 0);
            renderProjectsMonth();
        }

        function renderWeek() {
            const weekGrid = document.getElementById('weekGrid');
            const weekDisplay = document.getElementById('weekDisplay');
            const weekDates = getWeekDates(currentWeekStart);
            
            // Update week display
            const weekEnd = new Date(weekDates[6]);
            weekDisplay.textContent = `${formatDate(weekDates[0])} - ${formatDate(weekEnd)}`;

            const dropPrevHtml = '<div class="week-drop-zone" id="dropPrevWeek" data-move="prev" title="Drop to move to same day, previous week">← Prev week</div>';
            const dropNextHtml = '<div class="week-drop-zone" id="dropNextWeek" data-move="next" title="Drop to move to same day, next week">Next week →</div>';

            weekGrid.innerHTML = dropPrevHtml + weekDates.map((date, index) => {
                const dateKey = getDateKey(date);
                const dayTodos = todos[dateKey] || [];
                const dayName = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][date.getDay()];
                const isTodayClass = isToday(date) ? 'today' : '';

                // Sort todos: incomplete first, then completed
                const sortedTodos = [...dayTodos].sort((a, b) => {
                    if (a.completed === b.completed) return 0;
                    return a.completed ? 1 : -1;
                });

                return `
                    <div class="day-column ${isTodayClass}">
                        <div class="day-header">
                            <div class="day-name">${dayName}</div>
                            <div class="day-number ${isTodayClass}">${date.getDate()}</div>
                        </div>
                        <div class="day-input-container">
                            <input 
                                type="text" 
                                class="day-input" 
                                placeholder="Add task..."
                                data-date="${dateKey}"
                                onkeypress="handleDayInputKeypress(event, '${dateKey}')"
                            >
                        </div>
                        <div class="day-todos" data-date="${dateKey}" ondragover="handleDayDragOver(event)" ondragleave="handleDayDragLeave(event)" ondrop="handleDayDrop(event)">
                            ${sortedTodos.length === 0 
                                ? '<div class="empty-day">No tasks</div>'
                                : sortedTodos.map((todo, todoIndex) => {
                                    const actualIndex = dayTodos.findIndex(t => t.id === todo.id);
                                    return `
                                        <div class="todo-item ${todo.completed ? 'completed' : ''}" draggable="true" ondragstart="handleTodoDragStart(event, '${dateKey}', ${actualIndex})" ondragend="handleTodoDragEnd(event)">
                                            <input 
                                                type="checkbox" 
                                                class="todo-checkbox" 
                                                ${todo.completed ? 'checked' : ''}
                                                onchange="toggleTodo('${dateKey}', ${actualIndex})"
                                            >
                                            <span class="todo-text" ondblclick="startEditTodo(event, '${dateKey}', ${actualIndex})" title="Double-click to edit">${escapeHtml(todo.text)}</span>
                                            <button class="delete-btn" onclick="deleteTodo('${dateKey}', ${actualIndex})">×</button>
                                        </div>
                                    `;
                                }).join('')
                            }
                        </div>
                    </div>
                `;
            }).join('') + dropNextHtml;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function handleDayInputKeypress(event, dateKey) {
            if (event.key === 'Enter') {
                addTodoToDay(dateKey);
            }
        }

        const DRAG_TYPE = 'application/x-weekly-todos';

        function handleTodoDragStart(event, dateKey, index) {
            if (event.target.closest('input, button')) {
                event.preventDefault();
                return;
            }
            event.dataTransfer.setData(DRAG_TYPE, JSON.stringify({ dateKey, index }));
            event.dataTransfer.effectAllowed = 'move';
            event.target.classList.add('dragging');
            document.body.classList.add('dragging-todo');
        }

        function handleTodoDragEnd(event) {
            event.target.classList.remove('dragging');
            document.body.classList.remove('dragging-todo');
            document.querySelectorAll('.day-todos.drag-over, .week-drop-zone.drag-over').forEach(el => el.classList.remove('drag-over'));
        }

        function handleDayDragOver(event) {
            event.preventDefault();
            event.dataTransfer.dropEffect = 'move';
            event.currentTarget.classList.add('drag-over');
        }

        function handleDayDragLeave(event) {
            if (!event.currentTarget.contains(event.relatedTarget)) {
                event.currentTarget.classList.remove('drag-over');
            }
        }

        function handleDayDrop(event) {
            event.preventDefault();
            event.currentTarget.classList.remove('drag-over');
            const targetDateKey = event.currentTarget.dataset.date;
            const data = event.dataTransfer.getData(DRAG_TYPE);
            if (!data) return;
            const { dateKey, index } = JSON.parse(data);
            moveTodo(dateKey, index, targetDateKey);
        }

        function setupWeekDropZones() {
            ['prev', 'next'].forEach(move => {
                const el = document.getElementById('drop' + (move === 'prev' ? 'Prev' : 'Next') + 'Week');
                if (!el) return;
                el.ondragover = function (e) {
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                    el.classList.add('drag-over');
                };
                el.ondragleave = function (e) {
                    if (!el.contains(e.relatedTarget)) el.classList.remove('drag-over');
                };
                el.ondrop = function (e) {
                    e.preventDefault();
                    el.classList.remove('drag-over');
                    const data = e.dataTransfer.getData(DRAG_TYPE);
                    if (!data) return;
                    const { dateKey, index } = JSON.parse(data);
                    const sourceDate = new Date(dateKey + 'T12:00:00');
                    const newDate = new Date(sourceDate);
                    newDate.setDate(sourceDate.getDate() + (move === 'next' ? 7 : -7));
                    const newDateKey = getDateKey(newDate);
                    moveTodo(dateKey, index, newDateKey);
                };
            });
        }

        function moveTodo(fromDateKey, fromIndex, toDateKey) {
            if (fromDateKey === toDateKey) return;
            const todo = todos[fromDateKey]?.[fromIndex];
            if (!todo) return;
            todos[fromDateKey].splice(fromIndex, 1);
            if (todos[fromDateKey].length === 0) delete todos[fromDateKey];
            if (!todos[toDateKey]) todos[toDateKey] = [];
            todos[toDateKey].push(todo);
            saveTodos();
            renderWeek();
            setupWeekDropZones();
        }

        function addTodoToDay(dateKey) {
            const input = document.querySelector(`.day-input[data-date="${dateKey}"]`);
            const text = input.value.trim();
            
            if (text === '') {
                return;
            }

            if (!todos[dateKey]) {
                todos[dateKey] = [];
            }

            const newTodo = {
                id: Date.now() + Math.random(),
                text: text,
                completed: false
            };

            todos[dateKey].push(newTodo);
            input.value = '';
            saveTodos();
            renderWeek();
        }

        function toggleTodo(dateKey, index) {
            if (!todos[dateKey] || !todos[dateKey][index]) return;
            
            todos[dateKey][index].completed = !todos[dateKey][index].completed;
            saveTodos();
            renderWeek();
        }

        function deleteTodo(dateKey, index) {
            if (!todos[dateKey] || !todos[dateKey][index]) return;
            
            todos[dateKey].splice(index, 1);
            if (todos[dateKey].length === 0) {
                delete todos[dateKey];
            }
            saveTodos();
            renderWeek();
        }

        function updateTodo(dateKey, index, newText) {
            if (!todos[dateKey] || !todos[dateKey][index]) return;
            newText = (newText || '').trim();
            if (newText === '') return;
            todos[dateKey][index].text = newText;
            saveTodos();
            renderWeek();
        }

        function startEditTodo(event, dateKey, index) {
            if (event.target.closest('input')) return;
            const item = event.target.closest('.todo-item');
            const span = event.target;
            if (!item || !span.classList.contains('todo-text')) return;
            const currentText = (todos[dateKey] && todos[dateKey][index]) ? todos[dateKey][index].text : '';
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'todo-edit-input';
            input.value = currentText;
            item.classList.add('editing');
            span.replaceWith(input);
            input.focus();
            input.select();
            function finish() {
                const newText = input.value.trim();
                item.classList.remove('editing');
                if (newText !== '' && newText !== currentText) {
                    updateTodo(dateKey, index, newText);
                } else {
                    renderWeek();
                }
            }
            input.onblur = finish;
            input.onkeydown = function (e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    input.blur();
                }
                if (e.key === 'Escape') {
                    e.preventDefault();
                    item.classList.remove('editing');
                    renderWeek();
                }
            };
        }

        function previousWeek() {
            currentWeekStart.setDate(currentWeekStart.getDate() - 7);
            renderWeek();
        }

        function nextWeek() {
            currentWeekStart.setDate(currentWeekStart.getDate() + 7);
            renderWeek();
        }

        function jumpToCurrentWeek() {
            const now = new Date();
            currentWeekStart.setTime(now.getTime());
            currentWeekStart.setDate(currentWeekStart.getDate() - currentWeekStart.getDay());
            currentWeekStart.setHours(0, 0, 0, 0);
            renderWeek();
            setupWeekDropZones();
        }

        function saveTodos() {
            localStorage.setItem('weeklyTodos', JSON.stringify(todos));
            showSavedStatus();
        }

        function showSavedStatus() {
            const el = document.getElementById('saveStatus');
            if (!el) return;
            el.textContent = 'Saved';
            el.classList.remove('saved');
            el.offsetHeight;
            el.classList.add('saved');
        }

        function exportBackup() {
            const data = { weeklyTodos: todos, weeklyProjects: weeklyProjects, exportedAt: new Date().toISOString() };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'weekly-todos-backup-' + new Date().toISOString().slice(0, 10) + '.json';
            a.click();
            URL.revokeObjectURL(a.href);
            showSavedStatus();
        }

        function importBackup(event) {
            const file = event.target.files?.[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function () {
                try {
                    const data = JSON.parse(reader.result);
                    const imported = data.weeklyTodos || data;
                    if (typeof imported !== 'object' || imported === null) throw new Error('Invalid format');
                    todos = imported;
                    if (data.weeklyProjects != null && typeof data.weeklyProjects === 'object') {
                        weeklyProjects = data.weeklyProjects;
                        saveProjects();
                        renderProjectsMonth();
                    }
                    saveTodos();
                    renderWeek();
                    const statusEl = document.getElementById('saveStatus');
                    statusEl.textContent = 'Import complete';
                    statusEl.style.color = '';
                    statusEl.classList.remove('saved');
                } catch (e) {
                    const statusEl = document.getElementById('saveStatus');
                    statusEl.textContent = 'Import failed: invalid file';
                    statusEl.style.color = '#dc3545';
                }
                event.target.value = '';
            };
            reader.readAsText(file);
        }

        window.addEventListener('beforeunload', function () {
            saveTodos();
            saveProjects();
        });

        // Initial render
        renderWeek();
        setupWeekDropZones();
        renderProjectsMonth();
    </script>
</body>
</html>
